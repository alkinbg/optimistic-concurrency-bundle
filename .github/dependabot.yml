version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Sofia
    open-pull-requests-limit: 5
    groups:
      symfony:
        patterns:
          - 'symfony/*'
      doctrine:
        patterns:
          - 'doctrine/*'
      quality-tools:
        dependency-type: development
        patterns:
          - 'friendsofphp/*'
          - 'phpstan/*'
          - 'phpunit/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Sofia
    open-pull-requests-limit: 3
