name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  code-style:
    name: Code style
    # Trusted repository refs get the full CI suite.
    # Fork pull requests use the isolated fork-pr job below.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --locked

      - name: Check code style
        run: vendor/bin/php-cs-fixer check --diff --config=.php-cs-fixer.dist.php

  quality:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    # Trusted repository refs get the complete supported PHP/dependency matrix.
    # Fork pull requests use the isolated fork-pr job below.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            dependencies: lowest
            composer_options: '--prefer-lowest --prefer-stable'
            audit: false

          - php: '8.2'
            dependencies: latest
            composer_options: ''
            audit: true

          - php: '8.3'
            dependencies: latest
            composer_options: ''
            audit: true

          - php: '8.4'
            dependencies: latest
            composer_options: ''
            audit: true

          - php: '8.5'
            dependencies: latest
            composer_options: ''
            audit: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress ${{ matrix.composer_options }}

      - name: Audit dependencies
        if: matrix.audit
        run: composer audit --locked

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M

  fork-pr:
    name: Fork PR / PHP 8.4
    # Untrusted fork contributions execute only on an isolated GitHub-hosted runner
    # and do not receive repository secrets or write permissions.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run QA
        run: composer qa

  postgresql:
    name: PostgreSQL / PHP 8.4
    # Run the database portability gate for pushes and trusted pull requests.
    # Fork pull requests remain isolated from service-backed release checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: optimistic_concurrency
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optimistic_concurrency"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Verify PHP and Composer
        run: |
          php -v
          composer --version

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run functional suite on PostgreSQL
        env:
          OPTIMISTIC_CONCURRENCY_DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:5432/optimistic_concurrency?serverVersion=16'
        run: vendor/bin/phpunit
