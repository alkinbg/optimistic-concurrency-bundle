name: Bug report
description: Report a reproducible problem in OptimisticConcurrencyBundle
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not disclose security vulnerabilities here; follow SECURITY.md instead.

  - type: input
    id: bundle-version
    attributes:
      label: Bundle version
      description: Use a release such as v1.0.0 or an exact commit SHA.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.4.x
    validations:
      required: true

  - type: input
    id: symfony-version
    attributes:
      label: Symfony version
      placeholder: 8.1.x
    validations:
      required: true

  - type: input
    id: doctrine-version
    attributes:
      label: Doctrine ORM / DoctrineBundle versions
      placeholder: ORM 3.6.x / DoctrineBundle 3.x
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the controller attributes, entity version mapping, relevant request headers and the smallest code needed to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs or sanitized traces if useful. Never include credentials, personal data or production secrets.
